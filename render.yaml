services:
  - type: web
    name: acms-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: NUU_HOST
        value: 0.0.0.0
      - key: NUU_COOKIE_SECURE
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: NUU_ALLOWED_ORIGINS
        sync: false
      - key: NUU_ADMIN_PASSWORD
        generateValue: true
